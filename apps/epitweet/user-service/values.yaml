# Written by the CMP from the import of 3-Istor/epitweet at d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2.
# Change it from the CMP: the next build rewrites this file.
image:
  repository: ghcr.io/3-istor/imports/epitweet/user-service
  digest: sha256:f0a850d87765a05802ea83ae32400d64235352779e0db954550025bcfc0817ba
service:
  ports:
  - name: http
    port: 8081
    targetPort: 8081
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: '1'
    memory: 384Mi
monitoring:
  enabled: false
env:
- name: QUARKUS_HTTP_PORT
  value: '8081'
- name: QUARKUS_MONGODB_DATABASE
  value: epitweet_user
- name: QUARKUS_REDIS_HOSTS
  value: redis://redis:6379
secrets:
  enabled: true
  vaultPath: project-epitweet/user-service/imports
workload:
  probes:
    liveness:
      tcpSocket:
        port: 8081
      periodSeconds: 10
    readiness:
      tcpSocket:
        port: 8081
      periodSeconds: 5
    startup:
      tcpSocket:
        port: 8081
      periodSeconds: 5
      failureThreshold: 36
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 185
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  tmpDirs:
  - /tmp
