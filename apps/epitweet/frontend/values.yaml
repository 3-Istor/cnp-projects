# Written by the CMP from the import of 3-Istor/epitweet at d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2.
# Change it from the CMP: the next build rewrites this file.
image:
  repository: ghcr.io/3-istor/imports/epitweet/frontend
  digest: sha256:28ab3f92d330dde4004ec499c283d926f0e4c5427e95219c40afd74914e0437e
service:
  ports:
  - name: http
    port: 80
    targetPort: 80
resources:
  requests:
    cpu: 100m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 64Mi
monitoring:
  enabled: true
  path: /
workload:
  probes:
    liveness:
      tcpSocket:
        port: 80
      periodSeconds: 10
    readiness:
      tcpSocket:
        port: 80
      periodSeconds: 5
    startup:
      tcpSocket:
        port: 80
      periodSeconds: 5
      failureThreshold: 12
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
offhours:
  enabled: true
  sleepAt: 15 1 * * *
  wakeAt: 15 7 * * *
  timezone: Europe/Paris
network:
  allowFrom: []
