# A record exercising every field, for reference. Not consumed by the ApplicationSet:
# only registry/projects/*.yaml is.
apiVersion: cnp.3istor.com/v1alpha1
kind: ProjectRecord
metadata:
  name: atlas
  owner: bperret
  createdAt: "2026-09-15T10:00:00Z"
spec:
  targetCloud: aws
  status: active
  deletionProtection: true

  # Staging runs on up to maxApps apps (set by a platform admin), one when
  # staging is not listed. Each app then chooses with its own environments list.
  environments:
    - name: prod
      offhours: false
      dbInstances: 2
    - name: staging
      offhours: true
      dbInstances: 1
      maxApps: 1

  apps:
    - name: atlas-web
      type: fullstack
      repoURL: https://github.com/3-Istor/atlas-web
      ssoProtected: true
      environments: [prod, staging]
      hostnames:
        prod: atlas-web-atlas.3istor.com
        staging: atlas-web-atlas-staging.3istor.com
    - name: atlas-docs
      type: static
      repoURL: https://github.com/3-Istor/atlas-docs
      ssoProtected: false
      hostnames:
        prod: atlas-docs-atlas.3istor.com

    # Imported apps (CNP-239): the platform builds the image from source, the
    # CMP writes apps/atlas/<app>/values.yaml in this repo, and Argo CD never
    # reads the source repo. dependsOn links stay inside the project (CNP-240).
    - name: user-service
      type: service
      source:
        repo: https://github.com/acme/tinyx
        path: tinyx/user-service
        sha: 3f6c2a9d8e1b4c7a0f5e2d9c8b7a6f5e4d3c2b1a
      dependsOn:
        - app: mongodb
          port: 27017
        - app: atlas-gateway
          port: 8080
          alias: gateway
    - name: atlas-gateway
      type: service
      public: true
      source:
        repo: https://github.com/acme/tinyx
        path: tinyx/gateway
        sha: 3f6c2a9d8e1b4c7a0f5e2d9c8b7a6f5e4d3c2b1a
      hostnames:
        prod: atlas-gateway-atlas.3istor.com
    - name: mongodb
      type: backing

  features:
    gatus: true
    offhoursGuard: true
    gateway: true
    tunnel: true
    keycloak: true
