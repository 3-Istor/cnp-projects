apiVersion: cnp.3istor.com/v1alpha1
kind: ProjectRecord
metadata:
  name: epitweet
  owner: brian.perret
  createdAt: '2026-11-14T13:27:28.188443+00:00'
spec:
  targetCloud: onprem
  status: active
  environments:
  - name: prod
  apps:
  - name: mongodb
    type: backing
    repoURL: https://github.com/3-Istor/epitweet
  - name: redis
    type: backing
    repoURL: https://github.com/3-Istor/epitweet
  - name: neo4j
    type: backing
    repoURL: https://github.com/3-Istor/epitweet
  - name: elasticsearch
    type: backing
    repoURL: https://github.com/3-Istor/epitweet
  - name: user-service
    type: service
    public: false
    source:
      repo: https://github.com/3-Istor/epitweet
      path: tinyx/user-service
      sha: d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2
    dependsOn:
    - app: redis
      port: 6379
    repoURL: https://github.com/3-Istor/epitweet
  - name: post-service
    type: service
    public: false
    source:
      repo: https://github.com/3-Istor/epitweet
      path: tinyx/post-service
      sha: d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2
    dependsOn:
    - app: redis
      port: 6379
    - app: social-graph-service
      port: 8084
    repoURL: https://github.com/3-Istor/epitweet
  - name: like-service
    type: service
    public: false
    source:
      repo: https://github.com/3-Istor/epitweet
      path: tinyx/like-service
      sha: d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2
    dependsOn:
    - app: redis
      port: 6379
    - app: social-graph-service
      port: 8084
    repoURL: https://github.com/3-Istor/epitweet
  - name: social-graph-service
    type: service
    public: false
    source:
      repo: https://github.com/3-Istor/epitweet
      path: tinyx/socialgraph-service
      sha: d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2
    dependsOn:
    - app: redis
      port: 6379
    repoURL: https://github.com/3-Istor/epitweet
  - name: timeline-service
    type: service
    public: false
    source:
      repo: https://github.com/3-Istor/epitweet
      path: tinyx/timeline-service
      sha: d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2
    dependsOn:
    - app: redis
      port: 6379
    - app: social-graph-service
      port: 8084
    - app: user-service
      port: 8081
    repoURL: https://github.com/3-Istor/epitweet
  - name: frontend
    type: service
    public: true
    hostnames:
      prod: frontend-epitweet.3istor.com
    source:
      repo: https://github.com/3-Istor/epitweet
      path: frontend
      sha: d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2
    dependsOn:
    - app: like-service
      port: 8083
    - app: post-service
      port: 8082
    - app: search-service
      port: 8086
    - app: social-graph-service
      port: 8084
    - app: timeline-service
      port: 8085
    - app: user-service
      port: 8081
    repoURL: https://github.com/3-Istor/epitweet
  - name: search-service
    type: service
    public: false
    source:
      repo: https://github.com/3-Istor/epitweet
      path: tinyx/search-service
      sha: d9b680e85a1ea9952e073bd52dae1d5a9d83a1b2
    dependsOn:
    - app: elasticsearch
      port: 9200
    - app: redis
      port: 6379
    repoURL: https://github.com/3-Istor/epitweet
  features:
    gatus: true
    offhoursGuard: true
    gateway: true
    tunnel: true
    egressIsolation: true
