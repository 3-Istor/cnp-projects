apiVersion: cnp.3istor.com/v1alpha1
kind: ProjectRecord
metadata:
  name: iot
  owner: hugo.guillet
  createdAt: '2026-11-02T18:51:45.070594+00:00'
spec:
  targetCloud: onprem
  status: active
  environments:
  - name: prod
  apps:
  - name: optispace
    type: fullstack
    repoURL: https://github.com/3-Istor/optispace
    hostnames:
      prod: optispace-iot.3istor.com
      staging: optispace-iot-staging.3istor.com
    environments:
    - prod
    - staging
  - name: landing
    type: static
    repoURL: https://github.com/3-Istor/landing
    hostnames:
      prod: landing-iot.3istor.com
  features:
    gatus: true
    offhoursGuard: true
    gateway: true
    tunnel: true
  deletionProtection: true
